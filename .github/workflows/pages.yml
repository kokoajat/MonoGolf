name: Julkaise GitHub Pagesiin

on:
  push:
    branches:
      - claude/html-minigolf-sensor-game-kr82xf
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Yksi julkaisu kerrallaan; käynnissä olevaa ei keskeytetä.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sivusto julkaistaan yhtenä HTML-tiedostona. Erillisinä tiedostoina
      # selain tai CDN voisi tarjoilla uuden sivun vanhojen tyylien ja
      # skriptien kanssa; koosteena päivitys on atominen.
      - name: Koosta sivusto
        run: node tools/bundle.mjs

      - name: Ota Pages käyttöön
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pakkaa sivusto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Julkaise
        id: deployment
        uses: actions/deploy-pages@v4
