<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12281a" />
    <meta
      name="description"
      content="MonoGolf – 18 väylän minigolf superpallolla, ohjaus puhelimen liikeantureilla."
    />
    <title>MonoGolf – 18 väylän minigolf</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- iOS: aloitusnäytöltä käynnistys ilman selainkehyksiä. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MonoGolf" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f8f4e'/><circle cx='12' cy='20' r='6' fill='white'/><path d='M22 6v14' stroke='white' stroke-width='2'/><path d='M22 7l7 3-7 3z' fill='%23e33b2e'/></svg>"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="hole">
          <span class="hole-number" id="holeNumber">1/18</span>
          <span class="hole-name" id="holeName">Avaus</span>
        </div>
        <div class="stats">
          <div class="stat"><span id="par">Par 2</span></div>
          <div class="stat"><b id="strokes">0</b><small>lyöntiä</small></div>
          <div class="stat"><b id="total">–</b><small>yhteensä</small></div>
          <button id="btnMenu" class="icon" aria-label="Valikko" aria-expanded="false">
            ⚙
          </button>
        </div>
      </header>

      <!-- Peli täyttää ruudun; tila ja mittarit kelluvat radan päällä. -->
      <main class="stage">
        <canvas id="course"></canvas>
        <div class="hud" id="hud">
          <p class="hud-status" id="status">Heilauta puhelinta lyödäksesi.</p>
          <div class="hud-meters" id="hudMeters">
            <div class="meter">
              <span class="meter-label">Voima</span>
              <div class="bar"><div class="fill power" id="powerFill"></div></div>
              <span class="meter-value" id="powerLabel">0 %</span>
            </div>
            <div class="meter" id="motionRow" hidden>
              <span class="meter-label">Liike</span>
              <div class="bar"><div class="fill motion" id="motionFill"></div></div>
              <span class="meter-value">anturi</span>
            </div>
          </div>
        </div>
      </main>

      <!-- Valikko avautuu rataskuvakkeesta eikä vie tilaa pelialueelta. -->
      <section class="menu" id="menu" hidden>
        <div class="menu-head">
          <h2>Valikko</h2>
          <button id="btnMenuClose" class="icon" aria-label="Sulje valikko">✕</button>
        </div>
        <p class="hint" id="hint"></p>
        <p class="hint note" id="menuNote" hidden></p>
        <p class="hint" id="installHint" hidden>
          Lisää peli aloitusnäytölle (selaimen jakovalikosta), niin se avautuu ilman
          selainpalkkeja.
        </p>
        <div class="controls">
          <button id="btnSensors">Ota anturit käyttöön</button>
          <button id="btnMode">Tila: heilautus</button>
          <button id="btnSound" aria-label="Äänet päällä">🔊</button>
          <button id="btnRemote">Kaukosäädin</button>
          <button id="btnFullscreen">Koko näyttö</button>
          <button id="btnReset">Alusta väylä</button>
          <button id="btnScore">Tulokset</button>
          <button id="btnNewGame" class="ghost">Nollaa peli</button>
        </div>
      </section>

      <!-- Laiteparin muodostus QR-koodeilla. -->
      <section id="remote" class="sheet" hidden>
        <div class="menu-head">
          <h2 id="remoteTitle">Kaukosäädin</h2>
          <button id="remoteClose" class="icon" aria-label="Sulje">✕</button>
        </div>
        <p class="hint" id="remoteStatus"></p>

        <div id="remoteRoles" class="controls">
          <button id="btnRoleScreen" class="primary">Tämä on näyttö</button>
          <button id="btnRoleClub">Tämä on maila</button>
        </div>

        <div id="remoteStage" hidden>
          <div id="remoteQrWrap" class="qr-wrap">
            <canvas id="remoteQr"></canvas>
          </div>
          <div id="remoteScanWrap" class="scan-wrap" hidden>
            <video id="remoteVideo" muted playsinline></video>
          </div>
          <p class="hint" id="remoteFrames"></p>
          <div class="controls">
            <button id="remoteNext" hidden></button>
          </div>
        </div>
      </section>

      <!-- Mailapuhelimen oma näkymä. -->
      <section id="controller" class="controller" hidden>
        <div class="controller-info">
          <span id="controllerHole">–</span>
          <span id="controllerStrokes"></span>
        </div>
        <div class="controller-main">
          <!-- Tähtäyskiekko: nuoli osoittaa mihin pallo lähtee. -->
          <div class="swing-ring" id="swingRing">
            <svg viewBox="-50 -50 100 100" aria-hidden="true">
              <circle class="dial" cx="0" cy="0" r="42" />
              <line class="tick" x1="0" y1="-42" x2="0" y2="-34" />
              <g id="aimNeedle">
                <path class="needle" d="M0,-36 L6,6 L0,0 L-6,6 Z" />
              </g>
            </svg>
            <span class="ring-label" id="swingPhase">Nollaa lyöntiasento</span>
          </div>
          <p class="controller-status" id="controllerStatus"></p>
        </div>
        <div class="bar wide"><div class="fill power" id="controllerPower"></div></div>
        <button id="controllerZero" class="primary big">Nollaa lyöntiasento</button>
        <div class="controls">
          <button id="controllerMode">Tila: golf-lyönti</button>
          <button id="controllerLeave" class="ghost">Katkaise yhteys</button>
        </div>
      </section>

      <div id="overlay" class="overlay" hidden>
        <div class="card" id="overlayCard"></div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
